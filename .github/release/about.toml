# The third-party licences shipped in every release archive (`delivery/52` R-REL-13, D-149): `velme-cli`'s default
# features on the five release targets, generated by `cargo about` in `release.yml`. The accepted licences are
# `deny.toml`'s, with CDLA-Permissive-2.0 for the bundled CA roots.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

name: Bug
description: Velme or the spec does something wrong.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `velme --version`, or the commit you built from.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest `.velme` program or IR, and the command you ran.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual
      description: What you expected, what happened (diagnostic codes, output), and the spec id if you know it.
    validations:
      required: true

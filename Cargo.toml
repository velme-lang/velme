[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/velme-lang/velme"
authors = ["The Velme contributors"]

[workspace.dependencies]
# Workspace crates; edges must follow INV-9 (`xtask layering`).
velme-diagnostics = { path = "crates/velme-diagnostics", version = "0.1.0" }
velme-syntax = { path = "crates/velme-syntax", version = "0.1.0" }
velme-builtins = { path = "crates/velme-builtins", version = "0.1.0" }
velme-sema = { path = "crates/velme-sema", version = "0.1.0" }
velme-ir = { path = "crates/velme-ir", version = "0.1.0" }
velme-interp = { path = "crates/velme-interp", version = "0.1.0" }
velme-check = { path = "crates/velme-check", version = "0.1.0" }
# No default features: the provider SDKs (`ureq`) come only where a crate asks for them, so the core crates never carry one
# (AC-REL-03).
velme-synth = { path = "crates/velme-synth", version = "0.1.0", default-features = false }
velme-runtime = { path = "crates/velme-runtime", version = "0.1.0" }
velme-test-support = { path = "crates/velme-test-support", version = "0.1.0" }

anyhow = "1"
# The `SynthProvider` trait is used as a trait object (`compiler/22` §3.1, R-SYNTH-04).
async-trait = "0.1"
ariadne = { version = "0.6", default-features = false }
# Every fingerprint and artifact address is BLAKE3 over canonical JSON (D-21, `runtime/32` §2).
blake3 = "1"
chumsky = { version = "0.12", default-features = false, features = ["std"] }
insta = { version = "1", features = ["glob", "json"] }
# `O_NOFOLLOW` and `O_NONBLOCK` for reading the artifact store and lock (`runtime/32` R-ART-09); Unix only.
libc = "0.2"
proptest = { version = "1", default-features = false, features = ["std"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The wave scheduler (`runtime/30` R-RUN-07): the `rt` runtime and its bounded blocking pool only, no I/O or timers.
tokio = { version = "1", default-features = false, features = ["rt"] }
# Reads and writes `velme.lock` (`runtime/32` §5) and, later, `velme.toml` (`tooling/40` §5).
# The `anthropic` provider's HTTPS client (`compiler/22` R-SYNTH-04): blocking, rustls, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"] }
toml = { version = "1", default-features = false, features = ["std", "serde", "parse", "display"] }

# CC-ERR-01, CC-STY-03. `unsafe_code` is forbidden per crate (`#![forbid(unsafe_code)]`), not here, because
# `velme-wasm` is the one crate that may use it (CC-API-04).
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
indexing_slicing = "warn"
panic = "warn"
unreachable = "warn"

[package]
name = "velme-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
description = "Fuzz targets for the Velme parser and IR validator (R-SYN-19, R-IR-18, delivery/51)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
velme-diagnostics = { path = "../crates/velme-diagnostics" }
velme-syntax = { path = "../crates/velme-syntax" }
velme-ir = { path = "../crates/velme-ir" }
velme-sema = { path = "../crates/velme-sema" }

# Not a member of the main workspace: cargo-fuzz needs nightly and its own build.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

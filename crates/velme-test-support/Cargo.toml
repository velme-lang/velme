[package]
name = "velme-test-support"
description = "Velme: test-support crate (see docs/spec/compiler/20-compiler-architecture.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A test crate, never released: it turns on `velme-synth`'s `test-endpoint` (R-SYNTH-44).
publish = false

[[bin]]
name = "velme-test-backend"
path = "src/bin/velme-test-backend.rs"

[dependencies]
velme-builtins.workspace = true
velme-check.workspace = true
velme-diagnostics.workspace = true
velme-interp.workspace = true
velme-ir.workspace = true
velme-runtime.workspace = true
velme-sema.workspace = true
velme-synth = { workspace = true, features = ["test-endpoint", "provider-ollama"] }
async-trait.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision"] }

[lints]
workspace = true

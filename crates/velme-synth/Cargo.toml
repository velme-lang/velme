[package]
name = "velme-synth"
description = "Velme: synth crate (see docs/spec/compiler/20-compiler-architecture.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The `anthropic` provider and its HTTP client (R-SYNTH-04); the CLI turns it on.
default = ["provider-anthropic", "provider-ollama", "provider-external"]
provider-anthropic = ["dep:ureq"]
# The `ollama` provider, which shares the HTTP client (R-SYNTH-04).
provider-ollama = ["dep:ureq"]
# The `external` provider, which shares the HTTP client (R-SYNTH-04, D-101).
provider-external = ["dep:ureq"]
# `Anthropic::with_test_endpoint`, for `velme-test-support` only (R-SYNTH-44, D-98); never in a release build.
test-endpoint = ["provider-anthropic"]

[dependencies]
async-trait.workspace = true
schemars.workspace = true
serde.workspace = true
# Number text is kept exactly, never read through `f64` (CC-DET-03); reply and request documents carry IR numbers.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
velme-builtins.workspace = true
velme-check.workspace = true
velme-diagnostics.workspace = true
velme-ir.workspace = true
velme-sema.workspace = true
ureq = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` for the no-follow reads of `fsio`.
libc.workspace = true

[dev-dependencies]
insta.workspace = true
tokio.workspace = true
velme-test-support.workspace = true

[lints]
workspace = true

[package]
name = "velme-ir"
description = "Velme: ir crate (see docs/spec/compiler/20-compiler-architecture.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
schemars.workspace = true
serde.workspace = true
# Number text is kept exactly, never read through `f64` (CC-DET-03, D-23); `from_json_str` bounds depth itself.
serde_json = { workspace = true, features = ["arbitrary_precision", "unbounded_depth"] }

[dev-dependencies]
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true

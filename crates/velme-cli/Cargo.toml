[package]
name = "velme-cli"
description = "The `velme` command-line interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "velme"
path = "src/main.rs"

[features]
# The `scripted` provider and `VELME_SYNTH_SCRIPT` (`tooling/40` §5.2, D-94): for tests only, never in a release build.
test-provider = []

[dependencies]
async-trait.workspace = true
serde.workspace = true
# Number text is kept exactly, never read through `f64` (CC-DET-03).
serde_json = { workspace = true, features = ["arbitrary_precision", "unbounded_depth"] }
velme-builtins.workspace = true
velme-diagnostics.workspace = true
velme-ir.workspace = true
velme-runtime.workspace = true
velme-sema.workspace = true
velme-syntax.workspace = true
velme-synth.workspace = true

[dev-dependencies]
insta.workspace = true
velme-test-support.workspace = true

[lints]
workspace = true

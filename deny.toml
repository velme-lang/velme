# Second line of defence for R-REL-03 and T-6 (`tooling/41`); the crate-edge rules live in `xtask layering`.
[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only. Unicode-3.0 covers `unicode-ident` (every proc macro, incl. serde's) and Zlib
# covers `foldhash` (via chumsky's hashbrown); both are OSI approved and compatible with MIT OR Apache-2.0.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

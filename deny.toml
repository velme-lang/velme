# Second line of defence for R-REL-03 and T-6 (`tooling/41`); the crate-edge rules live in `xtask layering`.
[advisories]
yanked = "deny"

[licenses]
allow = ["MIT", "Apache-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Second line of defence for R-REL-03 and T-6 (`tooling/41`); the crate-edge rules live in `xtask layering`.
[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only. Unicode-3.0 covers `unicode-ident` (every proc macro, incl. serde's) and Zlib
# covers `foldhash` (via chumsky's hashbrown); both are OSI approved and compatible with MIT OR Apache-2.0.
# The `anthropic` provider's TLS stack (ureq, rustls, ring, webpki) adds ISC (ring, rustls-webpki, untrusted),
# BSD-3-Clause (subtle) and CDLA-Permissive-2.0 (webpki-roots' CA list); all permissive, none copyleft.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib", "ISC", "BSD-3-Clause", "CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
